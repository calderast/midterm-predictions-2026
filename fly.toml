# Fly.io config. Change `app` if the name is taken.
app = "midterm-pool-2026"
primary_region = "sjc"

[env]
  HOST = "0.0.0.0"
  PORT = "8080"
  DB_PATH = "/data/data.db"

[[mounts]]
  source = "pool_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
